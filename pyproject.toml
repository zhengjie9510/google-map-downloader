[project]
name = "google-map-downloader"
version = "1.2.0"
description = "Download Google Maps tiles and save them as a georeferenced TIFF."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10",
    "rasterio>=1.4",
]

[tool.uv]
package = false
